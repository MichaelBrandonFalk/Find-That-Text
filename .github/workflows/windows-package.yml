name: Verify Windows package

on:
  push:
    branches:
      - codex/windows-package
  workflow_dispatch:

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build Windows bundle
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify extracted bundle
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $archive = "dist/Find-That-Text-v$version-Windows-x64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "find-that-text-extracted"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          python scripts/verify_windows_bundle.py (Join-Path $extract "Find That Text")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-verified
          path: dist/Find-That-Text-v*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
