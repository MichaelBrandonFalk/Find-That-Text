[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "find-that-text"
dynamic = ["version"]
description = "Find and rank screen-text moments that may need forced captions."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Find That Text Contributors" }]
keywords = ["ocr", "video", "forced-text", "subtitles", "paddleocr", "macos", "apple-silicon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "av==18.1.0",
  "numpy>=2.2,<3",
  "Pillow>=11.3,<12",
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.0",
  "PySide6==6.11.2",
  "rapidfuzz>=3.13,<4",
  "scenedetect==0.7.1",
  "wordfreq==3.1.1",
  "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
onnx = ["onnxruntime==1.30.0"]
dev = [
  "pytest>=8.4,<9",
  "pyinstaller==6.22.3",
]

[project.scripts]
find-that-text = "find_that_text.cli:main"
find-that-text-gui = "find_that_text.app:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
find_that_text = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
